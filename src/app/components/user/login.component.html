<div class="public-shell">
  <header class="public-bar">
    <a class="public-brand" routerLink="/"><img src="assets/pocklo.svg" alt=""><span>小兜 <small>Pocklo</small></span></a>
  </header>
  <main class="public-main">
    <p class="eyebrow">POCKLO / SIGN IN</p>
    <h1>登录小兜</h1>
    <p class="intro">使用友间登录。也可以继续使用齐天簿。</p>
    <div class="public-actions">
      <button type="button" class="primary" (click)="friendenLogin()" [disabled]="pending">{{pending ? '正在打开友间…' : '使用友间登录'}}</button>
      <a [href]="qitianUrl">使用齐天簿登录</a>
    </div>
    <p *ngIf="error" class="intro login-note" role="alert">{{error}}</p>
    <p class="intro login-note">已有小兜账号但尚未绑定友间？请先用齐天簿登录，再在「账号设置」里绑定，之后就能用友间进入原账号。首次使用小兜可以直接用友间创建账号。</p>
  </main>
</div>
