<div class="public-shell">
  <header class="public-bar">
    <a class="public-brand" routerLink="/"><img src="assets/pocklo.svg" alt=""><span>小兜 <small>Pocklo</small></span></a>
    <nav aria-label="主导航">
      <a routerLink="/res">我的文件</a>
      <button *ngIf="loggedIn" type="button" class="logout" [disabled]="pending" (click)="logout()">退出登录</button>
    </nav>
  </header>

  <main class="public-main account-main">
    <p class="eyebrow">POCKLO / ACCOUNT</p>
    <h1>账号设置</h1>
    <div *ngIf="loggedIn" class="public-actions"><a routerLink="/account/applications">已授权应用</a></div>
    <section class="sample account-panel" aria-labelledby="frienden-title">
      <h2 id="frienden-title">友间绑定</h2>
      <p>授权后，小兜会记录友间已验证的手机号，之后可以用友间登录。</p>
      <p *ngIf="message" role="status">{{message}}</p>
      <p *ngIf="error" class="account-error" role="alert">{{error}}</p>
      <p *ngIf="pending" role="status">处理中…</p>

      <div *ngIf="!loggedIn" class="public-actions">
        <a class="primary" routerLink="/" [queryParams]="{next: '/account'}">登录小兜</a>
      </div>
      <ng-container *ngIf="status as binding">
        <p *ngIf="binding.linked" class="account-status">已绑定 · {{binding.phone}}</p>
        <div class="public-actions">
          <button *ngIf="!binding.linked" type="button" class="primary" [disabled]="pending" (click)="link()">绑定友间</button>
          <button *ngIf="binding.linked && !confirmUnlink" type="button" [disabled]="pending" (click)="link()">同步手机号</button>
          <button *ngIf="binding.linked && binding.can_unlink && !confirmUnlink" type="button" [disabled]="pending" (click)="confirmUnlink = true">解绑</button>
        </div>
        <div *ngIf="confirmUnlink">
          <p>确认解绑并删除小兜保存的手机号？</p>
          <div class="public-actions">
            <button type="button" [disabled]="pending" (click)="confirmUnlink = false">取消</button>
            <button type="button" class="account-error" [disabled]="pending" (click)="unlink()">确认解绑</button>
          </div>
        </div>
      </ng-container>
    </section>
  </main>
</div>
