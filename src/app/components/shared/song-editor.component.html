<dialog #dialog aria-modal="true" aria-labelledby="song-editor-title" (cancel)="$event.preventDefault(); !busy && closed.emit()">
  <form novalidate (ngSubmit)="save()">
    <header class="sheet-header">
      <div><h2 id="song-editor-title">歌曲信息</h2><p>整理这首歌的封面、信息和歌词</p></div>
      <button class="icon-button" type="button" aria-label="关闭歌曲信息" [disabled]="busy" (click)="closed.emit()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
      </button>
    </header>
    <div class="sheet-content">
      <div class="status" *ngIf="loading" role="status"><span class="spinner"></span>正在读取歌曲信息…</div>
      <div class="status" *ngIf="status === 'pending' || status === 'parsing'" role="status">
        <span class="spinner"></span><span>正在解析内嵌信息</span><button type="button" class="text-button" (click)="manual()">手动填写</button>
      </div>
      <div class="status" *ngIf="status === 'failed'"><span>暂时无法读取内嵌信息，可直接填写</span><button type="button" class="text-button" (click)="retry()">重新解析</button></div>
      <ng-container *ngIf="!loading">
        <section class="identity">
          <button class="cover-preview" type="button" [disabled]="busy" (click)="coverInput.click()" aria-label="选择歌曲封面">
            <img *ngIf="coverPreview || existingPreview" [src]="coverPreview || existingPreview" alt="歌曲封面" referrerpolicy="no-referrer">
            <svg *ngIf="!coverPreview && !existingPreview" viewBox="0 0 48 48" aria-hidden="true"><path d="M19 33V13l18-4v20M19 20l18-4"/><ellipse cx="13" cy="34" rx="6" ry="4"/><ellipse cx="31" cy="30" rx="6" ry="4"/></svg>
            <span class="cover-edit">更换封面</span>
          </button>
          <div class="identity-meta">
            <span class="section-caption">音频文件</span><strong [title]="audioFile?.name || name">{{audioFile?.name || name}}</strong>
            <span class="source-status">{{coverFile ? '已选择新封面' : removeCover ? '不使用封面' : song?.cover || embeddedCover ? '已读取封面信息' : '暂无封面'}}</span>
            <div class="inline-actions">
              <button type="button" [disabled]="busy" (click)="coverInput.click()">选择封面</button>
              <button type="button" class="text-button muted" [disabled]="busy" (click)="removeArtwork()">移除</button>
            </div>
          </div>
          <input #coverInput type="file" hidden accept="image/png,image/jpeg,image/webp" (change)="chooseCover($event)" [disabled]="busy">
        </section>
        <div class="preference-row">
          <div><strong>使用内嵌封面</strong><small>优先使用音频文件中的专辑封面</small></div>
          <button type="button" class="switch" role="switch" aria-label="使用内嵌封面" [attr.aria-checked]="useEmbedded" [disabled]="busy" (click)="toggleEmbedded()"><span></span></button>
        </div>
        <section class="metadata">
          <label class="full">歌名<input name="title" [(ngModel)]="title" maxlength="256" placeholder="输入歌名" [disabled]="busy" autocomplete="off"></label>
          <label class="full">歌手<span class="field-hint">多位歌手可分行填写</span><textarea name="artists" [(ngModel)]="artists" rows="2" placeholder="添加歌手" [disabled]="busy"></textarea></label>
          <label>专辑<input name="album" [(ngModel)]="album" maxlength="256" placeholder="添加专辑" [disabled]="busy"></label>
          <label>时长<span class="duration-field"><input type="number" name="duration" [(ngModel)]="durationSeconds" min="0" max="86400" step="0.001" placeholder="未识别" [disabled]="busy"><span>秒</span></span></label>
        </section>
        <section class="lyrics-section">
          <div class="section-heading"><h3>歌词</h3><button type="button" class="text-button" [disabled]="busy" (click)="lyricsInput.click()">导入歌词文件</button></div>
          <input #lyricsInput type="file" hidden accept=".lrc,.txt" (change)="readLyrics($event)" [disabled]="busy">
          <div class="segments" role="group" aria-label="歌词格式">
            <button *ngFor="let option of lyricFormats" type="button" [attr.aria-pressed]="lyricsType === option.id" [disabled]="busy" (click)="lyricsType = option.id">{{option.name}}</button>
            <button *ngIf="lyricsType === 'synchronized'" type="button" aria-pressed="true" [disabled]="busy">内嵌同步歌词</button>
          </div>
          <label class="lyric-editor" *ngIf="lyricsType === 'text' || lyricsType === 'lrc'">
            <span class="sr-only">歌词内容</span><textarea name="lyrics" [(ngModel)]="lyrics" rows="6" [placeholder]="lyricsType === 'lrc' ? '[00:12.00] 在这里填写这一句歌词' : '在这里填写歌词'" [disabled]="busy"></textarea>
          </label>
          <p class="empty-lyrics" *ngIf="lyricsType === 'none'">可以稍后补充歌词</p>
          <p class="empty-lyrics" *ngIf="lyricsType === 'synchronized'">已保留音频中的同步歌词</p>
        </section>
        <section class="audio-options" *ngIf="song">
          <button class="disclosure" type="button" [attr.aria-expanded]="advanced" (click)="advanced = !advanced"><span>替换音频</span><svg viewBox="0 0 24 24" [class.expanded]="advanced" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
          <div class="audio-options-body" *ngIf="advanced">
            <button class="attachment" type="button" [disabled]="busy" (click)="audioInput.click()"><span>选择新音频</span><small>{{audioFile?.name || '从设备上传'}}</small></button>
            <input #audioInput type="file" hidden accept="audio/*,.mp3" (change)="audioFile = $any($event.target).files[0]" [disabled]="busy">
            <label>或使用已有资源<input name="audioResource" [(ngModel)]="audioResource" placeholder="输入音频资源 ID" [disabled]="busy"></label>
          </div>
        </section>
      </ng-container>
      <p *ngIf="error" class="error" role="alert">{{error}}</p>
    </div>
    <footer>
      <span class="footer-note">{{busy ? '正在保存歌曲信息' : '音频、封面和歌词独立保存'}}</span>
      <button type="button" [disabled]="busy" (click)="closed.emit()">取消</button>
      <button class="primary" type="submit" [disabled]="busy || loading || !title.trim()"><span *ngIf="busy" class="spinner"></span>{{busy ? '正在保存' : song ? '保存修改' : '建立歌曲'}}</button>
    </footer>
  </form>
</dialog>
